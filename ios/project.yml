name: NodusDrift
options:
  bundleIdPrefix: com.drakonis96
  deploymentTarget:
    iOS: '17.0'
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 6RPLS9EA4X
    GENERATE_INFOPLIST_FILE: NO
targets:
  NodusDrift:
    type: application
    platform: iOS
    sources:
      - path: NodusDrift
        excludes: [Resources]
      - path: NodusDrift/Resources/catalog.json
        buildPhase: resources
      - path: NodusDrift/Resources/Audio
        type: folder
        buildPhase: resources
      - path: NodusDrift/Resources/Legal
        type: folder
        buildPhase: resources
      - path: NodusDrift/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.drakonis96.nodusdrift
        INFOPLIST_FILE: NodusDrift/Info.plist
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '8'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  NodusDriftTests:
    type: bundle.unit-test
    platform: iOS
    sources: [NodusDriftTests]
    dependencies: [{target: NodusDrift}]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  NodusDriftUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [NodusDriftUITests]
    dependencies: [{target: NodusDrift}]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  NodusDrift:
    build:
      targets:
        NodusDrift: all
    test:
      targets: [NodusDriftTests, NodusDriftUITests]
